# 꽃사슴 앱 깨워 두기: Streamlit Community Cloud 는 12시간 동안 아무도 안 들어오면 앱을 재운다.
# 10시간마다 GitHub 서버에서 보이지 않는 브라우저(Playwright)로 앱을 열고, 잠들어 있으면 깨우기 단추를 누른다.
# 내 컴퓨터에는 아무것도 설치하지 않는다. Actions 탭에서 「Run workflow」로 바로 돌려 볼 수도 있다.
name: keep-awake

on:
  schedule:
    # UTC 0시 · 10시 · 20시 (한국 시간 9시 · 19시 · 새벽 5시). GitHub 가 몇 분~수십 분 늦게 돌리기도 한다
    - cron: "0 */10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: https://myservice99.streamlit.app/
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 브라우저 설치
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: 앱 열기 (잠들어 있으면 깨우기)
        shell: python
        run: |
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=120_000)
              page.wait_for_timeout(10_000)

              # 잠든 앱: 「Yes, get this app back up!」 단추가 나온다
              wake = page.get_by_role("button", name="get this app back up")
              if wake.count():
                  print("앱이 잠들어 있어 깨우기 단추를 누릅니다")
                  wake.first.click()

              # 앱 화면이 뜰 때까지 최대 5분 기다린다. 앱은 페이지 안의 틀(iframe)에 그려진다
              for _ in range(30):
                  if any(frame.locator('[data-testid="stApp"]').count() for frame in page.frames):
                      print("앱이 떠 있습니다:", url)
                      break
                  page.wait_for_timeout(10_000)
              else:
                  raise SystemExit("5분 안에 앱 화면을 찾지 못했습니다: " + url)

              # 잠깐 머물러 방문으로 잡히게 한다
              page.wait_for_timeout(20_000)
              browser.close()
